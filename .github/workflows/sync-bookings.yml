# Mỗi giờ gọi app trên Render: (1) đồng bộ "3.2 List duyệt book" từ Lark Base (src/lib/bookingSync.ts),
# (2) cập nhật chỉ số KOL từ TikTok Shop qua Trạm dữ liệu (src/lib/creatorStats.ts, ~10 phút).
# Gọi cũng đánh thức Render free nếu đang ngủ. Chạy tay: tab Actions > Sync bookings > Run workflow.
name: Sync bookings
on:
  schedule:
    - cron: '7 * * * *' # phút 7 mỗi giờ; GitHub hay trễ vào đầu giờ
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          ok=0
          for job in sync-bookings creator-stats; do
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 900 -X POST "https://booking-lqms.onrender.com/api/cron/$job")
            echo "$job: $code $(cat out.json)"
            [ "$code" = 500 ] && ok=1
          done
          exit $ok
