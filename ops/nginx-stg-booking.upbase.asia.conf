# nginx trên server DX (54.254.6.67): /etc/nginx/sites-available/stg-booking.upbase.asia
# Booking Hub chạy trong container booking-hub (127.0.0.1:3060). Chứng chỉ: certbot webroot /var/www/certbot.
server {
    listen 80;
    listen [::]:80;
    server_name stg-booking.upbase.asia stg-apibooking.upbase.asia;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stg-booking.upbase.asia stg-apibooking.upbase.asia;
    ssl_certificate /etc/letsencrypt/live/stg-booking.upbase.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg-booking.upbase.asia/privkey.pem;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        # absUrl() (src/lib/session.ts) dựng link đăng nhập Lark từ 2 header này.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s; # lượt đồng bộ Lark do cron gọi có thể chạy lâu
    }
}
